<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom · 小说推荐问卷</title>
<style>body{font:16px/1.65 system-ui,sans-serif;color:#182b49;background:#f3f6fb;margin:0;padding:48px 24px}main{max-width:880px;margin:auto}h1{font-size:34px;line-height:1.3;margin:0 0 12px}.intro{color:#53657e;margin:0 0 28px}#error{color:#b45309}@media(max-width:600px){body{padding:28px 12px}h1{font-size:28px}}</style>
<main>
<h1>下一本，读什么？</h1>
<p class="intro">按喜好选择，找到一部想读的小说。可以随时返回上一题，或打开流程图查看路线、回到已访问的问题。</p>
<div id="questionnaire" data-diagram data-src="./multi-branch.json" data-view="questionnaire" data-height="440"></div>
<p id="error" role="alert"></p>
</main>
<script type="module">
  try {
    let init;
    if (new URLSearchParams(location.search).get('format') === 'iife') {
      await new Promise((resolve,reject) => {
        const script=document.createElement('script');script.src='../dist/diagram.min.js';
        script.onload=resolve;script.onerror=()=>reject(new Error('无法加载 Loom 脚本'));document.head.append(script);
      });
      init=window.Diagram.init;
    } else { ({init}=await import('../dist/diagram.js')); }
    const results=await init(document.querySelector('#questionnaire'));
    if(results[0].error) throw results[0].error;
    window.questionnaire=results[0].instance;
  } catch(error) {document.querySelector('#error').textContent=error.message;}
</script>
</html>
