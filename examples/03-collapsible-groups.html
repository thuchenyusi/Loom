<!doctype html>
<html lang="zh-CN">

<title>Loom · Collapsible Groups</title>

<main><h1>Collapsible Groups</h1><p>点击分组按钮或图中的分组切换折叠。二次验证是嵌套分组；折叠后外部连线连接到分组。</p><div id="diagram"></div><p id="error" role="alert"></p></main>
<script src="../dist/diagram.min.js"></script>
<script>
Diagram.renderDiagram(document.querySelector('#diagram'), './combo.json', {height:640})
.then(instance => { window.demo=instance; }).catch(error => {document.querySelector('#error').textContent=error.message;});
</script>
