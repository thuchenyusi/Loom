<!doctype html><html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom · Interactive Function</title>
<style>body{font:16px system-ui;background:#f3f6fb;color:#182b49;margin:24px}main{max-width:1000px;margin:auto}</style>
<main><h1>Interactive Function</h1><p>拖动蓝色点 P，点始终沿曲线移动；选中点后也可用左右箭头调整。</p><div id="diagram"></div><p id="event" aria-live="polite">等待点移动…</p><p id="error" role="alert"></p></main>
<script src="../dist/diagram.min.js"></script>
<script>
Diagram.renderDiagram(document.querySelector('#diagram'), './function.json', {height:480})
.then(instance => { window.demo=instance; instance.on('change', event => {window.lastChange=event; document.querySelector('#event').textContent='change: '+JSON.stringify(event.value);});})
.catch(error => {document.querySelector('#error').textContent=error.message;});
</script></html>
